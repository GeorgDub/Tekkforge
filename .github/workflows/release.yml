name: Release

# Baut TekkForge nativ unter Windows (NSIS-Installer, Portable, Zip) und
# veroeffentlicht das Ergebnis als GitHub-Release. Ausgeloest durch
#   - einen Push auf main, dessen package.json-Version noch keinen Tag hat
#     (Version anheben + mergen = Release; der Tag vX.Y.Z entsteht mit dem Release),
#   - einen Versions-Tag vX.Y.Z (muss zur package.json passen),
#   - von Hand (workflow_dispatch), gleiche Regel wie beim Push auf main.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows-Build + Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "Tag ${TAG} passt nicht zu package.json (${VERSION})" >&2
              exit 1
            fi
            RELEASE=true
          else
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} existiert schon — kein neues Release (Version in package.json anheben)."
              RELEASE=false
            else
              RELEASE=true
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.version.outputs.release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js einrichten
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Dependencies installieren
        if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: TypeScript pruefen
        if: steps.version.outputs.release == 'true'
        run: pnpm check

      - name: CLI + GUI bauen
        if: steps.version.outputs.release == 'true'
        run: pnpm build

      - name: Electron-Pakete bauen (NSIS, Portable, Zip)
        if: steps.version.outputs.release == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --win nsis portable zip --publish never

      - name: FX-Presets packen
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: 7z a -tzip "release/TekkForge-FX-Presets.zip" ./examples/fx-presets/*

      - name: Release-Notizen waehlen
        if: steps.version.outputs.release == 'true'
        id: notes
        shell: bash
        run: |
          NOTES="docs/versionen/${{ steps.version.outputs.version }}.md"
          if [[ -f "${NOTES}" ]]; then
            echo "path=${NOTES}" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build-Artefakte sichern
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tekkforge-windows-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/*.zip
          retention-days: 14

      - name: GitHub-Release anlegen
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TekkForge ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.zip
